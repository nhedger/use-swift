name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: git diff --exit-code -- dist

  install:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: [latest, "6.1", "6.2.1", main-snapshot]
        include:
          - os: ubuntu-24.04-arm
            version: latest
          - os: macos-15-intel
            version: latest
          - os: windows-11-arm
            version: latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Create a conflicting project version
        shell: bash
        run: echo '0.0.0' > .swift-version
      - uses: ./
        id: swift
        with:
          version: ${{ matrix.version }}
      - name: Verify minor version resolves to the latest patch
        if: matrix.version == '6.1'
        shell: bash
        env:
          REQUESTED_VERSION: ${{ matrix.version }}
          INSTALLED_VERSION: ${{ steps.swift.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const response = await fetch('https://www.swift.org/api/v1/install/releases.json');

          assert.ok(response.ok, `Swift.org returned HTTP ${response.status}`);

          const releases = await response.json();
          const minor = process.env.REQUESTED_VERSION;

          const latest = releases
            .map(release => release.name)
            .filter(version => version === minor || version.startsWith(`${minor}.`))
            .sort((a, b) => a.localeCompare(b, 'en', { numeric: true }))
            .at(-1);

          assert.ok(latest, `No releases found for Swift ${minor}`);

          const expected = latest.split('.').length === 2 ? `${latest}.0` : latest;

          assert.equal(process.env.INSTALLED_VERSION, expected);
          NODE
      - name: Verify compiler and environment in a subsequent step
        shell: bash
        env:
          INSTALLED_VERSION: ${{ steps.swift.outputs.version }}
        run: |
          test -n "$INSTALLED_VERSION"
          swift --version | grep -F "Swift version ${INSTALLED_VERSION%.0}"
          test "$(cat .swift-version)" = '0.0.0'
          if [ "$RUNNER_OS" != 'Windows' ]; then swiftly --version; fi
          mkdir smoke
          cd smoke
          swift package init --type executable
          swift run
